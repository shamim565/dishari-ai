{% load ui_extras %}
<div class="space-y-5">
  <div class="verified-banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="verified-banner-icon" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
    </svg>
    <div class="min-w-0">
      <p class="text-sm font-semibold">{{ t.verified_title }}</p>
      <p class="mt-0.5 text-xs text-slate-400">
        {{ journey.passenger_name }}
        {% if journey.seat %}· {{ t.seat_label }} {{ journey.seat }}{% endif %}
        {% if journey.pnr %}· {{ t.pnr_label }} {{ journey.pnr }}{% endif %}
      </p>
    </div>
  </div>
  {% include "partials/_journey_panel.html" %}
</div>
