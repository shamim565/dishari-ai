{% load static %}
<div class="assistant-stage" x-data="voiceApp()" x-init="init()">
  <div class="voice-mic-wrap"
       :class="{ 'is-listening': phase === 'listening', 'is-speaking': phase === 'speaking', 'is-thinking': phase === 'thinking' || phase === 'connecting' }">
    <span class="voice-ring voice-ring-1" aria-hidden="true"></span>
    <span class="voice-ring voice-ring-2" aria-hidden="true"></span>
    <button type="button" class="voice-mic" @click="micTap()" :aria-label="phaseCaption || '{{ t.chat_mic|escapejs }}'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-10 w-10" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3Z"/>
      </svg>
    </button>
  </div>

  <p class="voice-caption mt-6 text-center">
    <span class="voice-bars" x-show="phase === 'speaking'" x-cloak aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </span>
    <span x-text="phaseCaption"></span>
  </p>

  <p x-show="voiceMessage" x-cloak x-text="voiceMessage"
     class="mt-3 text-center text-xs leading-relaxed text-slate-400"></p>

  <div class="mt-5 flex items-center justify-center gap-3">
    <div x-show="sessionActive" x-cloak>
      <button type="button" class="session-stop-btn" @click="endSession()" :title="labels.end" aria-label="{{ t.voice_end }}">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="6.5" y="6.5" width="11" height="11" rx="2.2" fill="currentColor"/>
        </svg>
      </button>
    </div>
    <div x-show="showReplay" x-cloak>
      <button type="button" class="replay-btn" @click="replayLast()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-4 w-4" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 0 1 0 12.728M16.463 8.288a5.25 5.25 0 0 1 0 7.424M6.75 8.25l4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z"/>
        </svg>
        <span>{{ t.chat_replay }}</span>
      </button>
    </div>
  </div>

  <template x-if="voiceHint">
    <p class="mt-4 text-center text-[11px] text-slate-500" x-text="voiceHint"></p>
  </template>
</div>
