<header class="app-header sticky top-0 z-20">
  <div class="header-inner mx-auto flex w-full max-w-md items-center justify-between gap-3 px-4 py-3">
    <a href="{% url 'home' %}" class="flex min-w-0 items-center gap-2.5">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5" aria-hidden="true">
          <path d="M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.404Z"/>
        </svg>
      </span>
      <div class="min-w-0">
        <p class="truncate text-sm font-semibold leading-tight">{{ t.app_name }}</p>
        <p class="truncate text-[11px] leading-tight text-slate-400">{{ t.airport_name }}</p>
      </div>
    </a>
    <div class="flex items-center gap-2">
      <form method="post" action="{% url 'session_end' %}">
        {% csrf_token %}
        <button type="submit" class="lang-pill">{{ t.kiosk_end_btn }}</button>
      </form>
      <a href="{% url 'notifications' %}" class="lang-pill flex h-9 w-9 items-center justify-center !p-0" aria-label="{{ t.notif_title }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" class="h-4 w-4" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"/>
        </svg>
      </a>
      <a href="{% url 'set_lang' other_lang %}?next={{ request.path|urlencode }}" class="lang-pill">
        {% if lang == 'bn' %}English{% else %}<span class="font-bengali">বাংলা</span>{% endif %}
      </a>
    </div>
  </div>
</header>
