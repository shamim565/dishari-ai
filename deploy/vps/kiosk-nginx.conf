upstream airport_kiosk_web {
    server web:8000;
}

# TLS terminates at the outer nginx (ruletheday-backend). Preserve its
# X-Forwarded-Proto; fall back to $scheme when hit directly (loopback tests).
map $http_x_forwarded_proto $kiosk_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://airport_kiosk_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $kiosk_proto;
        proxy_read_timeout 60s;
    }
}
