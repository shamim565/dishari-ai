name: airport-kiosk

services:
  web:
    build: .
    env_file: .env
    volumes:
      - sqlite_data:/data
      - static_files:/app/staticfiles
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: airport-kiosk-nginx
    ports:
      - "127.0.0.1:8012:80"
    volumes:
      - ./deploy/vps/kiosk-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
    depends_on:
      - web
    networks:
      - default
      - shared
    restart: unless-stopped

networks:
  default:
  shared:
    external: true
    name: ruletheday-backend_default

volumes:
  sqlite_data:
  static_files:
